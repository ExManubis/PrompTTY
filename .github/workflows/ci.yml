on:
  pull_request:
    branches:
      - master
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
  workflow_call:

name: CI

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  RUSTFLAGS: -C debuginfo=line-tables-only --cfg=web_sys_unstable_apis

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  params:
    name: Compute workflow parameters
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    outputs:
      affects-database-schema: ${{ github.ref == 'master' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || steps.filter.outputs.affects-database-schema }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check changed files
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            affects-database-schema:
              - 'crates/persistence/src/schema.rs'
              - 'crates/persistence/migrations/**'

  tests:
    name: Run ${{ matrix.name }} tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            name: macOS
            runner: macos-latest
          - os: linux
            name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    needs: params
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: false
          install_test_deps: true

      - name: Install Shells
        uses: ConorMacBride/install-package@3e7ad059e07782ee54fa35f827df52aae0626f30 # v1
        with:
          apt: zsh fish
          brew: fish bash

      - name: Install cargo nextest
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: nextest

      - name: Compile tests
        run: ./script/run-core-tests --no-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        if: success()
        run: ./script/run-core-tests

      - name: Run doc tests
        if: success() || failure()
        run: ./script/run-core-tests --doc

      - name: Run completions-on-js tests
        if: success() || failure()
        run: cargo nextest run --locked -p warp_completer --features v2

  database-migration:
    name: Database Migration (Diesel)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: params
    if: ${{ needs.params.outputs.affects-database-schema == 'true' }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install cargo-binstall
        run: ./script/install_cargo_binstall

      - name: Install diesel_cli
        run: cargo binstall diesel_cli

      - name: Run all migrations on empty file
        run: |
          cp crates/persistence/src/schema.rs old-schema.rs
          diesel migration run --database-url="test.sqlite" --migration-dir="crates/persistence/migrations"

      - name: Regenerate schema and check if it is consistent with the schema at HEAD
        shell: bash
        run: diff -u old-schema.rs <(diesel print-schema --database-url="test.sqlite")

  lints:
    name: Formatting + Clippy (${{ matrix.name }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            name: macOS
            runner: macos-latest
          - os: linux
            name: Linux
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    needs: params
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: ${{ matrix.os }}
          is_self_hosted: false

      - name: Ensure Cargo.lock is up-to-date
        run: cargo metadata --locked --format-version=1 >/dev/null || (echo "::error::Cargo.lock is out-of-date with Cargo.toml. Run 'cargo check' to update." && exit 1)

      - name: Run ./script/format
        shell: bash
        run: ./script/format --check

      - name: Run cargo clippy
        shell: bash
        run: |
          set -e
          # Production code for the whole workspace. Do not pass --all-targets:
          # that typechecks every inherited test file, including account/Drive/UI
          # suites that are no longer in the default test run.
          cargo clippy --locked --workspace --exclude warp_completer --lib --bins --examples -- -D warnings
          cargo clippy --locked -p warp_completer --lib --bins --examples -- -D warnings
          # Workspace feature unification enables `warp/tui` through `warp_tui`.
          # Also lint the default GUI configuration used by `cargo run`.
          cargo clippy --locked -p warp --lib --bins -- -D warnings
          # Test targets only for the core suite (see script/core_test_package_args).
          cargo clippy --locked $(./script/core_test_package_args) --tests -- -D warnings
          cargo clippy --locked -p warp_completer --tests -- -D warnings
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run clang-format
        if: ${{ matrix.os == 'macos' }}
        run: |
          if [[ ! -d $(brew --prefix clang-format) ]]; then
            brew install clang-format
          fi
          ./script/run-clang-format.py -r --extensions 'c,h,cpp,m' ./crates/warpui/src/ ./app/src/

  general-lint:
    name: Miscellaneous checks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: params
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Install cargo-binstall
        run: ./script/install_cargo_binstall

      - name: Check licenses for dependencies
        run: |
          cargo binstall --force -y cargo-deny
          cargo deny -L error check licenses

      - name: Check deny.toml / about.toml license sync
        run: ./script/check_license_config_sync

      - name: Run WGSL formatter
        run: |
          cargo install --git https://github.com/wgsl-analyzer/wgsl-analyzer --tag "2025-06-28" wgslfmt && \
          find . -name "*.wgsl" -exec wgslfmt --check {} +

      - name: Check for incorrectly named test files
        run: |
          bad_files=$(find . -name '*_test.rs')
          if [ -n "$bad_files" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::Test file should be named ${f/_test.rs/_tests.rs} (use _tests.rs, not _test.rs)"
            done <<< "$bad_files"
            exit 1
          fi

      - name: Check for inline Rust test modules
        run: ./script/check_no_inline_test_modules

  wasm-lint:
    name: Formatting + Clippy (wasm)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: params
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: ./.github/actions/prepare_environment
        with:
          target_os: wasm
          is_self_hosted: false

      - name: Ensure Cargo.lock is up-to-date
        run: cargo metadata --locked --format-version=1 >/dev/null || (echo "::error::Cargo.lock is out-of-date with Cargo.toml. Run 'cargo check' to update." && exit 1)

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run cargo clippy
        run: cargo clippy --locked --target wasm32-unknown-unknown --profile release-wasm-debug_assertions -- -D warnings

  ci-result:
    name: Check CI results
    timeout-minutes: 3
    runs-on: ubuntu-latest
    if: >-
      !cancelled() &&
      (needs.params.result != 'skipped' || (github.event_name == 'pull_request' && github.event.pull_request.draft == true))
    needs:
      - params
      - database-migration
      - tests
      - lints
      - wasm-lint
      - general-lint
    steps:
      - name: Check CI results
        run: |
          echo '${{ toJSON(needs) }}' | jq -r '
            to_entries |
            map(select(.key != "database-migration")) |
            .[] |
            if .value.result != "success" then
              "::error::Required job \(.key) failed or was skipped (status: \(.value.result))"
            else
              empty
            end
          ' | {
            if read -r error; then
              echo "$error"
              exit 1
            fi
          }

          affects_schema="${{ needs.params.outputs.affects-database-schema }}"
          migration_result="${{ needs.database-migration.result }}"

          if [[ "$affects_schema" == "true" && "$migration_result" != "success" ]]; then
            echo "::error::Database migration job failed or was skipped when it should have run (status: $migration_result)"
            exit 1
          elif [[ "$affects_schema" != "true" && "$migration_result" != "skipped" ]]; then
            echo "::error::Database migration job should have been skipped but wasn't (status: $migration_result)"
            exit 1
          fi

          echo "All jobs completed successfully!"
